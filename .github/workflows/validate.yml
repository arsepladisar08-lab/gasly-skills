name: Validate GASLY

on:
  push:
    branches: ["work/**"]
  pull_request:
    branches: ["SOWAN"]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build distributions
        run: python build_skills.py
      - name: Static regression tests
        run: python -m unittest discover -s tests -v
      - name: Execute GAS Node harness
        run: node tests/harness.js
      - name: Verify deterministic generated artifacts
        run: git diff --exit-code -- dist
