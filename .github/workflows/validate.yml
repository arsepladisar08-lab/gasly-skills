name: Validate GASLY

permissions:
  contents: write

on:
  push:
    branches: ["work/**"]
  pull_request:
    branches: ["SOWAN"]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build distributions
        run: python build_skills.py
      - name: Static regression tests
        run: python -m unittest discover -s tests -v
      - name: Execute GAS Node harness
        run: node tests/harness.js
      - name: Capture generated distributions for exact rebuild review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gasly-dist
          path: dist/
          if-no-files-found: error
      - name: Sync generated distributions to the working branch
        run: |
          if ! git diff --quiet -- dist; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "build(dist): sync generated distribution artifacts"
            git push
          fi
      - name: Verify deterministic generated artifacts
        run: git diff --exit-code -- dist
