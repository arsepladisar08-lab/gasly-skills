name: Validate Gasly Skills & Contracts

on:
  push:
    branches: ["main", "SOWAN"]
    paths-ignore:
      - "dist/**"
  pull_request:

# Validation is read-only. Only the isolated publish job receives write access.
permissions:
  contents: read
    
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12" # <<PIN_VERSION>> recorded in VERIFY.md

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
        node-version: "22" # <<PIN_VERSION>> recorded in VERIFY.md

      - name: Build skill packages and verify RPC/manifest contracts
        run: python build_skills.py

      - name: Run WCAG AA contrast check across all design presets
        run: python tools/check_contrast.py

      - name: Run Python unit test suite
        run: python -m unittest discover -s tests -v

      - name: Run Node execution harness
        env:
          TZ: Asia/Jakarta
        run: |
          test -f tests/harness.js
          node tests/harness.js
          test -f tests/harness_gas.js
          node tests/harness_gas.js
          test -f tests/harness_install.js
          node tests/harness_install.js

  publish-dist:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12" # <<PIN_VERSION>> recorded in VERIFY.md

      - name: Rebuild skill packages
        run: python build_skills.py

      - name: Publish regenerated dist packages
        shell: bash
        run: |
          set -euo pipefail
          git add --all -- dist/
          if git diff --cached --quiet; then
            echo "dist/ already matches the source build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(dist): synchronize generated packages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
